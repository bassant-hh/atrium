<div class="layout-wrapper">
  <!-- Desktop Sidebar -->
  <div class="sidebar-wrapper">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Main Content Column -->
  <div class="content-wrapper">
    <app-topbar></app-topbar>

    @if (notification(); as notif) {
      <div class="global-toast-notification animate-in" role="alert" aria-live="assertive">
        <div class="toast-content-wrap">
          <div class="toast-icon-circle" aria-hidden="true">
            <i class="bi bi-patch-check-fill"></i>
          </div>
          <div class="toast-text-body">
            <h4 class="toast-title font-headline">{{ notif.title }}</h4>
            <p class="toast-message">{{ notif.message }}</p>
          </div>
        </div>
        <button
          class="btn-toast-close"
          type="button"
          (click)="onDismissNotification()"
          aria-label="Dismiss notification"
        >
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
    }

    <main class="page-content" role="main">
      <router-outlet></router-outlet>
    </main>

    <!-- Mobile Bottom Navigation Bar (Placeholder Anchor) -->
    <nav class="mobile-bottom-nav" role="navigation" aria-label="Mobile Bottom Navigation">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="mobile-nav-link"
        aria-label="Dashboard"
      >
        <i class="bi bi-speedometer2" aria-hidden="true"></i>
        <span class="label">Dashboard</span>
      </a>
      <a
        routerLink="/requests"
        routerLinkActive="active"
        class="mobile-nav-link"
        aria-label="Requests"
      >
        <i class="bi bi-truck" aria-hidden="true"></i>
        <span class="label">Requests</span>
      </a>
      <a routerLink="/active" routerLinkActive="active" class="mobile-nav-link" aria-label="Active">
        <i class="bi bi-person-walking" aria-hidden="true"></i>
        <span class="label">Active</span>
      </a>
      <a
        routerLink="/history"
        routerLinkActive="active"
        class="mobile-nav-link"
        aria-label="History"
      >
        <i class="bi bi-clock-history" aria-hidden="true"></i>
        <span class="label">History</span>
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="active"
        class="mobile-nav-link"
        aria-label="Profile"
      >
        <i class="bi bi-person-circle" aria-hidden="true"></i>
        <span class="label">Profile</span>
      </a>
    </nav>
  </div>
</div>
