<!doctype html>
<html lang="en">
  <body>
    <div class="pending-wrapper">
      <div class="pending-card">
        <div class="icon-wrap">
          <svg
            class="check-icon"
            viewBox="0 0 52 52"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle class="check-circle" cx="26" cy="26" r="25" stroke-width="2" />
            <path
              class="check-tick"
              d="M14 27l8 8 16-16"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
            />
          </svg>
        </div>

        <h1 class="title">Registration Submitted</h1>
        <p class="subtitle">Your identity is under review.</p>
        <p class="body-text">
          We will notify you once your account is approved.<br />
          This usually takes 1–2 business days.
        </p>

        <button class="waiting-btn" disabled>
          <span class="spinner"></span>
          Waiting for approval…
        </button>
      </div>
    </div>
  </body>
</html>
