<header class="topbar-container" role="banner">
  <div class="topbar-brand">
    <div class="logo-icon-wrapper" aria-hidden="true">
      <span class="material-symbols-outlined">pedal_bike</span>
    </div>
    <span class="brand-title font-headline">Makook Rider</span>
  </div>

  <!-- Reserved Space for Future: Search, Status Toggle, Notifications -->
  <div class="topbar-actions">
    <!-- Reserved space for Future: Notification Bell, Status Toggle, Search -->
    <button class="topbar-logout-btn" (click)="logout()" aria-label="Logout">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      <span class="btn-text">Logout</span>
    </button>
  </div>
</header>
