<div class="dashboard-wrapper">
  <!-- Blocking Verification Overlay Modal -->
  @if (verificationStatus() !== 'APPROVED') {
    <app-verification-overlay [verificationStatus]="verificationStatus()" (logout)="logout()" />
  }

  <!-- Main Dashboard Surface Container -->
  <main
    class="dashboard-surface animate-in"
    [class.surface-locked]="verificationStatus() !== 'APPROVED'"
    role="main"
    aria-label="Rider Dashboard Control Center"
  >
    <!-- Duty Status Control Card -->
    <app-rider-status-card [status]="riderStatus()" (toggleStatus)="toggleStatus()" />

    <!-- Error Alert Notification Banner -->
    @if (apiError()) {
      <div class="api-error-alert" role="alert">
        <span>⚠️ {{ apiError() }}</span>
        <button
          class="btn-dismiss-alert"
          type="button"
          (click)="dismissError()"
          aria-label="Dismiss error"
        >
          ✕
        </button>
      </div>
    }

    <!-- Today's Performance Statistics -->
    <app-dashboard-stats
      [earnings]="earnings()"
      [completed]="completed()"
      [onlineHours]="onlineHours()"
      [rating]="rating()"
    />

    <!-- Two-Column Operations Grid -->
    <div class="operations-grid">
      <!-- Left Column: Active Delivery & Nearby Orders Stream -->
      <div class="left-column">
        @if (activeDelivery()) {
          <app-active-delivery-card
            [activeDelivery]="activeDelivery()!"
            [riderCoords]="riderCoords()"
            [submitting]="loading()"
            (pickup)="onPickupOrder()"
            (deliver)="onDeliverOrder()"
          />
        }

        <app-nearby-orders
          [orders]="nearbyOrders()"
          [submittingId]="submittingOrderId()"
          (accept)="onAcceptOrder($event)"
          (decline)="onDeclineOrder($event)"
        />
      </div>

      <!-- Right Column: Campus Heatmap Placeholder -->
      <aside class="right-column" aria-label="Campus Heatmap View">
        <app-heatmap-placeholder />
      </aside>
    </div>
  </main>
</div>
