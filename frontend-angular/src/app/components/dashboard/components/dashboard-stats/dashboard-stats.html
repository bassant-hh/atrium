<section class="stats-grid" aria-label="Today's Performance Statistics">
  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-teal" aria-hidden="true">
      <span class="material-symbols-outlined">payments</span>
    </div>
    <div class="stat-body">
      <span class="stat-value font-headline">{{ earnings }}</span>
      <span class="stat-label">Today's Earnings</span>
    </div>
  </article>

  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-orange" aria-hidden="true">
      <span class="material-symbols-outlined">package_2</span>
    </div>
    <div class="stat-body">
      <span class="stat-value font-headline">{{ completed }}</span>
      <span class="stat-label">Completed Deliveries</span>
    </div>
  </article>

  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-blue" aria-hidden="true">
      <span class="material-symbols-outlined">schedule</span>
    </div>
    <div class="stat-body">
      <span class="stat-value font-headline">{{ onlineHours }}</span>
      <span class="stat-label">Online Hours</span>
    </div>
  </article>

  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-gold" aria-hidden="true">
      <span class="material-symbols-outlined">star</span>
    </div>
    <div class="stat-body">
      <span class="stat-value font-headline">{{ rating }}</span>
      <span class="stat-label">Rating</span>
    </div>
  </article>
</section>
