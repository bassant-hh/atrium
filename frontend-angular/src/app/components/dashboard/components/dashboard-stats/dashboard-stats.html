<section class="stats-grid" aria-label="Rider Performance Statistics">
  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-teal" aria-hidden="true">
      <span class="material-symbols-outlined">payments</span>
    </div>
    <div class="stat-body">
      @if (loading) {
        <div class="skeleton-line skeleton-value"></div>
      } @else {
        <span class="stat-value font-headline">{{ earnings }}</span>
      }
      <span class="stat-label">Total Earnings</span>
    </div>
  </article>

  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-orange" aria-hidden="true">
      <span class="material-symbols-outlined">package_2</span>
    </div>
    <div class="stat-body">
      @if (loading) {
        <div class="skeleton-line skeleton-value"></div>
      } @else {
        <span class="stat-value font-headline">{{ completed }}</span>
      }
      <span class="stat-label">Total Completed</span>
    </div>
  </article>

  <article class="stat-card shadow-card">
    <div class="stat-icon-wrap icon-blue" aria-hidden="true">
      <span class="material-symbols-outlined">schedule</span>
    </div>
    <div class="stat-body">
      @if (loading) {
        <div class="skeleton-line skeleton-value"></div>
      } @else {
        <span class="stat-value font-headline">{{ onlineHours }}</span>
      }
      <span class="stat-label">Today's Online Hours</span>
    </div>
  </article>
</section>
