<section class="status-card shadow-card" aria-label="Duty Status Control">
  <div class="status-info">
    <div
      class="status-badge"
      [class.badge-online]="status === 'ONLINE' || status === 'DELIVERING'"
      [class.badge-offline]="status === 'OFFLINE'"
    >
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">{{ status }}</span>
    </div>
    <h2 class="status-headline font-headline">
      Rider Duty:
      {{
        status === 'ONLINE'
          ? 'Ready for Orders'
          : status === 'DELIVERING'
            ? 'Active Delivery'
            : 'Off Duty'
      }}
    </h2>
  </div>
  <button
    class="status-toggle-btn"
    [class.btn-active]="status === 'ONLINE' || status === 'DELIVERING'"
    (click)="onToggle()"
    aria-label="Toggle Online Duty Status"
  >
    <span class="material-symbols-outlined" aria-hidden="true">
      {{ status === 'ONLINE' || status === 'DELIVERING' ? 'power_settings_new' : 'play_arrow' }}
    </span>
    <span>{{ status === 'ONLINE' || status === 'DELIVERING' ? 'Go Offline' : 'Go Online' }}</span>
  </button>
</section>
