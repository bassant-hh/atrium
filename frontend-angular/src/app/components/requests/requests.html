<section class="requests-inbox-section" aria-label="Rider Delivery Requests Inbox">
  <header class="inbox-header shadow-card">
    <div class="header-main">
      <div class="header-title-wrap">
        <i class="bi bi-inbox header-icon" aria-hidden="true"></i>
        <div>
          <h1 class="inbox-title font-headline">Requests</h1>
          <p class="inbox-subtitle">Available delivery requests near you.</p>
        </div>
      </div>
      <div class="inbox-count-pill" aria-label="Available Requests Count">
        <i class="bi bi-list-check" aria-hidden="true"></i>
        <span>
          {{ dashboardService.nearbyOrders().length }}
          {{ dashboardService.nearbyOrders().length === 1 ? 'Request' : 'Requests' }} Available
        </span>
      </div>
    </div>
  </header>

  <div class="inbox-content">
    <app-nearby-orders
      mode="full"
      [orders]="dashboardService.nearbyOrders()"
      [submittingId]="dashboardService.submittingOrderId()"
      (accept)="dashboardService.acceptOrder($event)"
      (decline)="dashboardService.declineOrder($event)"
    />
  </div>
</section>
