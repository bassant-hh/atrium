<div class="rejected-wrapper">
  <div class="rejected-card">
    <div class="icon-wrap">
      <svg class="cross-icon" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle
          cx="26"
          cy="26"
          r="24"
          stroke="#ef4444"
          stroke-width="3"
          fill="rgba(239, 68, 68, 0.1)"
        />
        <path
          d="M16 16l20 20M36 16L16 36"
          stroke="#ef4444"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <h1 class="title">Application rejected</h1>
    <p class="subtitle">Contact support for further assistance</p>
    <p class="body-text">
      Unfortunately, your rider application was not approved. Please contact our support team if you
      believe this was an error.
    </p>

    <div class="actions-row">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</div>
